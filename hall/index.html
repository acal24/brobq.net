<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />
  <meta name="description" content="The BRO-B-Q Hall of Flame" />
  <title>Hall of Flame · BRO-B-Q</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/hall.css" />
</head>

<body>
  <main>
    <header class="hall-hero">
      <a class="back-link" href="../">← Return to the Pit</a>
      <p class="brand">BRO-B-Q</p>
      <h1>Hall of Flame</h1>
      <p class="subhead">One name is added each year.</p>
    </header>

    <section class="honorees" aria-label="Brokayest Bro honorees">
      <article class="honoree current">
        <div class="portrait-wrap">
          <img src="../assets/images/hall/rich.png" alt="Rich holding the Brokayest Bro trophy" />
          <span class="trophy" aria-label="Current Brokayest Bro">
            <svg viewBox="0 0 64 64" role="img" aria-hidden="true">
              <path d="M20 10h24v8c0 9-5 17-12 20-7-3-12-11-12-20v-8Z"/>
              <path d="M20 15H10v6c0 8 6 14 14 14M44 15h10v6c0 8-6 14-14 14M32 38v9M22 54h20M26 47h12"/>
            </svg>
          </span>
        </div>

        <div class="honoree-copy">
          <p class="year">MMXXV</p>
          <h2>Rich</h2>
          <p class="detail">“My BBQ is better than yours.”</p>
        </div>
      </article>

      <article class="honoree">
        <div class="portrait-wrap">
          <img src="../assets/images/hall/ivan.png" alt="Ivan wearing sunglasses and a wide-brim hat" />
        </div>

        <div class="honoree-copy">
          <p class="year">MMXXIV</p>
          <h2>Ivan</h2>
          <p class="detail">“Tacos of Legend.”</p>
        </div>
      </article>
    </section>

    <section class="ogs" aria-label="Original attendees">
      <p class="section-label">OGs</p>
      <p>ACal <span>•</span> Rich <span>•</span> Ivan <span>•</span> Big Jim <span>•</span> JPal <span>•</span> Westicles</p>
    </section>

    <footer>
      <p>The fire changes hands.</p>
      <p>The tradition stays.</p>
    </footer>
  </main>
</body>
</html>
