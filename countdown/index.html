<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <title>Edition V Countdown · BRO-B-Q</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --pit:#0e0e0e;
      --bone:#f2efe6;
      --ash:#c9c2b6;
      --smoke:#68655f;
      --bourbon:#a96b2b;
      --rule:rgba(242,239,230,.16);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--pit);
      color:var(--bone);
    }

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow:hidden;
    }

    .page{
      position:relative;
      min-height:100svh;
      display:grid;
      place-items:center;
      isolation:isolate;
      background:var(--pit);
    }

    .poster{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      z-index:-3;
    }

    .veil{
      position:absolute;
      inset:0;
      z-index:-2;
      background:
        linear-gradient(to bottom,
          rgba(14,14,14,.18) 0%,
          rgba(14,14,14,.08) 38%,
          rgba(14,14,14,.24) 58%,
          rgba(14,14,14,.72) 100%);
    }

    .edge{
      position:absolute;
      inset:0;
      z-index:-1;
      box-shadow:inset 0 0 120px rgba(0,0,0,.46);
      pointer-events:none;
    }

    .countdown-wrap{
      position:absolute;
      left:0;
      right:0;
      bottom:max(5.2rem, calc(env(safe-area-inset-bottom) + 4.2rem));
      padding:0 1rem;
      display:flex;
      justify-content:center;
    }

    .countdown-card{
      width:min(92vw, 760px);
      padding:1.05rem 1rem 1rem;
      text-align:center;
      background:linear-gradient(
        to bottom,
        rgba(14,14,14,.38),
        rgba(14,14,14,.72)
      );
      border:1px solid var(--rule);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .eyebrow{
      margin:0 0 .72rem;
      color:var(--bourbon);
      font-size:.68rem;
      font-weight:600;
      letter-spacing:.24em;
      text-transform:uppercase;
    }

    .clock{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:.3rem;
      align-items:end;
    }

    .unit{
      min-width:0;
      border-right:1px solid var(--rule);
    }

    .unit:last-child{border-right:0}

    .number{
      display:block;
      font-family:"Cormorant Garamond",Georgia,serif;
      font-size:clamp(2.25rem, 12vw, 5.25rem);
      font-weight:600;
      line-height:.82;
      letter-spacing:-.035em;
      font-variant-numeric:tabular-nums;
      text-shadow:0 2px 24px rgba(0,0,0,.4);
    }

    .label{
      display:block;
      margin-top:.55rem;
      color:var(--ash);
      font-size:.52rem;
      font-weight:600;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .line{
      margin:.95rem 0 0;
      font-family:"Cormorant Garamond",Georgia,serif;
      font-size:clamp(1.05rem,4.4vw,1.45rem);
      font-style:italic;
      color:var(--bone);
    }

    .back{
      position:absolute;
      left:50%;
      bottom:max(1rem, env(safe-area-inset-bottom));
      transform:translateX(-50%);
      color:var(--ash);
      text-decoration:none;
      font-size:.66rem;
      font-weight:500;
      letter-spacing:.17em;
      text-transform:uppercase;
      opacity:.86;
      transition:opacity .2s ease,color .2s ease;
      white-space:nowrap;
    }

    .back:hover,
    .back:focus-visible{
      color:var(--bone);
      opacity:1;
    }

    .back:focus-visible{
      outline:1px solid var(--bourbon);
      outline-offset:6px;
    }

    .live{
      display:none;
      padding:.3rem 0 .15rem;
    }

    .live-title{
      margin:0;
      font-family:"Cormorant Garamond",Georgia,serif;
      font-size:clamp(2.4rem,10vw,5rem);
      line-height:.9;
      letter-spacing:.02em;
      text-transform:uppercase;
    }

    .live-sub{
      margin:.75rem 0 0;
      color:var(--bourbon);
      font-size:.68rem;
      font-weight:600;
      letter-spacing:.23em;
      text-transform:uppercase;
    }

    .is-live .clock,
    .is-live .line,
    .is-live .eyebrow{
      display:none;
    }

    .is-live .live{display:block}

    @media (min-width: 760px){
      .poster{
        object-fit:contain;
      }

      .page::before{
        content:"";
        position:absolute;
        inset:0;
        z-index:-4;
        background:
          linear-gradient(rgba(14,14,14,.58),rgba(14,14,14,.58)),
          url("edition-v-poster.jpg") center/cover no-repeat;
        filter:blur(20px) saturate(.75);
        transform:scale(1.05);
      }

      .countdown-wrap{
        bottom:3.6rem;
      }

      .countdown-card{
        padding:1.25rem 1.4rem 1.15rem;
      }

      .label{font-size:.58rem}
      .back{bottom:1.1rem}
    }

    @media (prefers-reduced-motion: reduce){
      *{
        scroll-behavior:auto!important;
        transition:none!important;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="page">
    <img
      class="poster"
      src="edition-v-poster.jpg"
      alt="BRO-B-Q Edition V poster for August 15, 2026"
    >
    <div class="veil" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>

    <section class="countdown-wrap" aria-label="Countdown to BRO-B-Q Edition V">
      <div class="countdown-card">
        <p class="eyebrow">Edition V begins in</p>

        <div class="clock" id="clock">
          <div class="unit">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
          </div>
          <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
          </div>
          <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="label">Minutes</span>
          </div>
          <div class="unit">
            <span class="number" id="seconds">00</span>
            <span class="label">Seconds</span>
          </div>
        </div>

        <p class="line">Tomorrow. We smoke.</p>

        <div class="live" aria-live="polite">
          <h1 class="live-title">All Day Smokin'</h1>
          <p class="live-sub">Edition V is underway</p>
        </div>
      </div>
    </section>

    <a class="back" href="../v/">Edition V</a>
  </main>

  <script>
    (() => {
      // BRO-B-Q Edition V
      // Saturday, August 15, 2026 at 10:00 AM Eastern Daylight Time.
      const target = new Date("2026-08-15T10:00:00-04:00").getTime();

      const page = document.getElementById("page");
      const daysEl = document.getElementById("days");
      const hoursEl = document.getElementById("hours");
      const minutesEl = document.getElementById("minutes");
      const secondsEl = document.getElementById("seconds");

      const pad = n => String(n).padStart(2, "0");

      function updateCountdown() {
        const now = Date.now();
        let remaining = target - now;

        if (remaining <= 0) {
          page.classList.add("is-live");
          return;
        }

        const days = Math.floor(remaining / 86400000);
        remaining %= 86400000;

        const hours = Math.floor(remaining / 3600000);
        remaining %= 3600000;

        const minutes = Math.floor(remaining / 60000);
        remaining %= 60000;

        const seconds = Math.floor(remaining / 1000);

        daysEl.textContent = pad(days);
        hoursEl.textContent = pad(hours);
        minutesEl.textContent = pad(minutes);
        secondsEl.textContent = pad(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
