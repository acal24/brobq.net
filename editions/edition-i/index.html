<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Edition I · BRO-B-Q</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/editions.css">
</head>
<body>
  <main>
    <section class="edition-hero" style="background-image:url('../../assets/images/editions/edition-i/hero.jpg')">
      <div class="hero-shade"></div>
      <div class="hero-copy">
        <a class="back-link" href="../">← Back to Editions</a>
        <p class="kicker">Edition I · MMXXII</p>
        <h1>Beginnings at the Farm</h1>
        <p class="hero-line">Every tradition has an invisible beginning.</p>
      </div>
    </section>

    <section class="opening">
      <p>No name.</p>
      <p>No trophies.</p>
      <p>No expectations.</p>
      <p>Just a Saturday at the farm.</p>
      <div class="date-place">September 24, 2022 <span>•</span> New Hope, Pennsylvania</div>
    </section>

    <section class="photo-feature">
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/table-wide.jpg" alt="Friends gathered around the table at the first BRO-B-Q"></button>
    </section>

    <section class="photo-pair">
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/prep-salmon.jpg" alt="Salmon being prepared"></button>
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/prep-greens.jpg" alt="Greens being prepared"></button>
    </section>

    <section class="photo-pair">
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/prep-seasoning.jpg" alt="Seasoning used during preparation"></button>
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/prep-sausage.jpg" alt="Sausage being prepared"></button>
    </section>

    <section class="photo-feature">
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/buffet.jpg" alt="The first BRO-B-Q dinner spread"></button>
    </section>

    <section class="photo-three">
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/food-1.jpg" alt="Food from Edition I"></button>
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/food-2.jpg" alt="Food from Edition I"></button>
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/food-3.jpg" alt="Food from Edition I"></button>
    </section>

    <section class="photo-pair">
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/aj.jpg" alt="Family at the first BRO-B-Q"></button>
      <button class="photo-button"><img src="../../assets/images/editions/edition-i/gathering.jpg" alt="A candid moment from the first BRO-B-Q"></button>
    </section>

    <section class="closing">
      <p>The tradition continued.</p>
    </section>

    <nav class="edition-nav" aria-label="Edition navigation">
      <a href="../">← Editions</a>
      <a href="../edition-ii/">Edition II →</a>
    </nav>
  </main>

  <dialog id="lightbox">
    <button id="close-lightbox" aria-label="Close image">×</button>
    <img id="lightbox-image" alt="">
  </dialog>
  <script src="../../assets/js/editions.js"></script>
</body>
</html>
